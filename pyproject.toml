[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sharmory"
version = "0.1.0"
description = "Installer for Sharmory - a triple-shell (Zsh, Bash, and PowerShell) developer toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Hariharen" }]
keywords = ["zsh", "powershell", "shell", "dotfiles"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Shells",
]
scripts = { sharmory-install = "sharmory_install.cli:main" }

[project.urls]
Homepage = "https://github.com/hariharen9/sharmory"
Repository = "https://github.com/hariharen9/sharmory"

[tool.hatch.build.targets.sdist]
include = [
  "packaging/python/sharmory_install",
  "functions.zsh",
  "functions.bash",
  "functions.ps1",
  "README.md",
  "LICENSE",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"packaging/python/sharmory_install" = "sharmory_install"
"functions.zsh"  = "sharmory_install/functions.zsh"
"functions.bash" = "sharmory_install/functions.bash"
"functions.ps1"  = "sharmory_install/functions.ps1"
